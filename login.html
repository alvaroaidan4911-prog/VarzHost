<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VarzHost</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/pricing">Pricing</a>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
</nav>

<div class="form-container">
    <h2 style="margin-bottom: 20px; text-align: center;">Login Client Area</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="******">
        </div>
        <button type="submit" class="btn-order" style="margin-top: 10px;">Masuk Akun</button>
    </form>
    <p style="text-align: center; margin-top: 15px; color: #94a3b8; font-size: 0.9rem;">
        Belum punya akun? <a href="/register" style="color: #38bdf8; text-decoration: none;">Daftar di sini</a>
    </p>
</div>

<script src="/assets/js/auth.js"></script>
</body>
</html>
