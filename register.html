<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VarzHost</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/pricing">Pricing</a>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
</nav>

<div class="form-container">
    <h2 style="margin-bottom: 20px; text-align: center;">Buat Akun VarzHost</h2>
    <form id="register-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="******">
        </div>
        <button type="submit" class="btn-order" style="margin-top: 10px;">Daftar Sekarang</button>
    </form>
</div>

<script src="/assets/js/auth.js"></script>
</body>
</html>
